name: Wallet Security CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/wallet-security-audit]

permissions:
  contents: read

concurrency:
  group: wallet-security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Isolated wallet security tests
        run: npm run test:wallet-security

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
