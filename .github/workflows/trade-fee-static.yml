name: Trade fee migration static guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/ads-fail-closed-owner-check"]

permissions:
  contents: read

jobs:
  trade-fee-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run static migration guardrails
        run: npm run test:trade-fee:static
