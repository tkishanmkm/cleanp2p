name: Deposit Attestation Tests

on:
  pull_request:
  push:
    branches:
      - fix/retire-unverified-deposit-entrypoints

jobs:
  deposit-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run deposit attestation tests
        run: npm run test:deposit-attestation
