name: Withdrawal Broadcast Regression

on:
  push:
    branches: ['security/withdrawal-broadcast-await-confirmations']
    paths:
      - 'src/jobs/withdrawalWorker.ts'
      - 'src/jobs/scheduler.ts'
      - 'src/lib/withdrawal-processor.ts'
      - 'src/app/api/internal/withdrawals/process/route.ts'
      - 'src/app/api/workers/withdraw/route.ts'
      - 'src/app/api/withdrawals/dispatch/route.ts'
      - 'src/lib/blockchain/tron.ts'
      - 'src/lib/blockchain/tronReceiptStatus.ts'
      - 'tests/withdrawal-broadcast-stage.test.ts'
      - 'tests/withdrawal-refund-wallet-row-migration.test.ts'
      - 'supabase/migrations/20261024000001_withdrawal_refund_wallet_row_fail_closed.sql'
      - 'tests/tron-withdrawal-receipt.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/withdrawal-broadcast-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/jobs/withdrawalWorker.ts'
      - 'src/jobs/scheduler.ts'
      - 'src/lib/withdrawal-processor.ts'
      - 'src/app/api/internal/withdrawals/process/route.ts'
      - 'src/app/api/workers/withdraw/route.ts'
      - 'src/app/api/withdrawals/dispatch/route.ts'
      - 'src/lib/blockchain/tron.ts'
      - 'src/lib/blockchain/tronReceiptStatus.ts'
      - 'tests/withdrawal-broadcast-stage.test.ts'
      - 'tests/withdrawal-refund-wallet-row-migration.test.ts'
      - 'supabase/migrations/20261024000001_withdrawal_refund_wallet_row_fail_closed.sql'
      - 'tests/tron-withdrawal-receipt.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/withdrawal-broadcast-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: withdrawal-broadcast-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Offline withdrawal regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies with diagnostics
        id: install
        shell: bash
        run: |
          set -o pipefail
          npm ci --verbose 2>&1 | tee npm-ci.log
      - name: Record install diagnostics in job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Withdrawal regression diagnostics"
            echo "- npm ci outcome: ${{ steps.install.outcome }}"
            echo "- Node: $(node --version 2>&1 || true)"
            echo "- npm: $(npm --version 2>&1 || true)"
            if [ -f npm-ci.log ]; then
              echo '### npm ci log tail'
              echo '```text'
              tail -n 100 npm-ci.log
              echo '```'
            else
              echo "npm-ci.log was not created; install step may not have started."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test TRON amount and receipt handling
        run: npm run test:tron-withdrawal
      - name: Test withdrawal broadcast-stage guards
        run: npm run test:withdrawal-stage
      - name: Test withdrawal refund migration guards
        run: npm run test:withdrawal-refund-migration
