name: Withdrawal Broadcast Regression

on:
  push:
    branches: ['security/withdrawal-broadcast-await-confirmations']
    paths:
      - 'src/jobs/withdrawalWorker.ts'
      - 'src/lib/blockchain/tron.ts'
      - 'src/lib/blockchain/tronReceiptStatus.ts'
      - 'tests/withdrawal-broadcast-stage.test.ts'
      - 'tests/tron-withdrawal-receipt.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/withdrawal-broadcast-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/jobs/withdrawalWorker.ts'
      - 'src/lib/blockchain/tron.ts'
      - 'src/lib/blockchain/tronReceiptStatus.ts'
      - 'tests/withdrawal-broadcast-stage.test.ts'
      - 'tests/tron-withdrawal-receipt.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/withdrawal-broadcast-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: withdrawal-broadcast-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Offline withdrawal regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies with diagnostics
        shell: bash
        run: |
          set -o pipefail
          npm ci --verbose 2>&1 | tee npm-ci.log
      - name: Upload install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: withdrawal-regression-diagnostics
          path: |
            npm-ci.log
            ~/.npm/_logs/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Test TRON amount and receipt handling
        run: npm run test:tron-withdrawal
      - name: Test withdrawal broadcast-stage guards
        run: npm run test:withdrawal-stage
